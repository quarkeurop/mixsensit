[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarkeurop-mixsensit"
version = "0.1.0"
description = "在多个配比下比较结果，测算各数据源的影响弹性"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "quarkeurop" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://quarkeurop.github.io"
Repository = "https://github.com/quarkeurop/mixsensit"
Issues = "https://github.com/quarkeurop/mixsensit/issues"

[project.scripts]
mixsensit = "mixsensit:main"

[tool.setuptools]
py-modules = ["mixsensit"]
